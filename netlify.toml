[build]
  command = "npm install && npm run build:lib"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express"]
  # 允许函数 import ./lib/dist 下的 .js 文件
  included_files = ["lib/dist/**"]

[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

[[redirects]]
  from = "/translate"
  to = "/translate.html"
  status = 301

# ── 环境变量（在 Netlify Dashboard 中配置）────────────
# CLOUDFLARE_ACCOUNT_ID  – Cloudflare 账户 ID
# CLOUDFLARE_API_TOKEN   – Cloudflare API Token（需 AI 权限）
# DEEPSEEK_API_KEY       – DeepSeek API Key
# AUTH_KEY               – 认证密钥后缀，与年月拼接为 Bearer YYYY+MM+AUTH_KEY