  <title>Vocal Saga — 翻译</title>
  <style>
    :root { --fg: #1a1a1a; --muted: #666; --bg: #fafafa; --border: #ddd; --accent: #0066cc; --err: #c00; }
    body { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; max-width: 900px; margin: 32px auto; padding: 0 16px; color: var(--fg); background: var(--bg); }
    h1 { font-size: 1.5em; margin: 0 0 8px; }
    h2 { font-size: 1.1em; margin: 24px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    label { font-size: 0.9em; color: var(--muted); }
    input, select, textarea, button { font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; background: #fff; }
    input[type="text"], input[type="password"] { width: 220px; }
    textarea { width: 100%; min-height: 180px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
    button { cursor: pointer; }
    button:hover { background: #f0f0f0; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { background: #0052a3; }
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
    .tab { padding: 8px 16px; cursor: pointer; border: 1px solid transparent; border-bottom: none; border-radius: 4px 4px 0 0; color: var(--muted); }
    .tab.active { background: #fff; border-color: var(--border); color: var(--fg); font-weight: 500; margin-bottom: -1px; }
    .panel { display: none; }
    .panel.active { display: block; }
    .terms { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; min-height: 32px; }
    .term { background: #e7f0fa; border: 1px solid #b5d3ed; border-radius: 12px; padding: 2px 10px; font-size: 0.85em; display: inline-flex; align-items: center; gap: 4px; }
    .term button { background: none; border: none; cursor: pointer; color: var(--muted); padding: 0 2px; font-size: 1em; line-height: 1; }
    .term button:hover { color: var(--err); background: none; }
    .term.user { background: #e8f5e9; border-color: #a5d6a7; }
    .term.doc { background: #fff3e0; border-color: #ffcc80; }
    .term.hard { background: #fde7e9; border-color: #f5a3ab; }
    .term.soft { background: #ede7f6; border-color: #b39ddb; }
    .output { background: #fff; border: 1px solid var(--border); border-radius: 4px; padding: 12px; white-space: pre-wrap; word-break: break-word; min-height: 60px; }
    .meta { color: var(--muted); font-size: 0.85em; margin-top: 6px; }
    .err { color: var(--err); }
    .hint { color: var(--muted); font-size: 0.85em; margin-top: 4px; }
  </style>

<h2 data-page-node-id="DsSTQSPZVPDAsVzb7fQR28">术语表</h2>
<div class="row" data-page-node-id="ckElvLvH4Bob5JU6wwcdt2">
  <input type="text" id="newTerm" placeholder="新术语…" style="width: 180px" data-page-node-id="6nEgpE0ZTkpO5c2vr6hW2n">
  <button id="addTerm" data-page-node-id="GIevYmtgYQuuErvaKW5qIJ">+ 加入 user_terms</button>
  <button id="extractTerms" data-page-node-id="6x4wuEMcpRFNZRT7t6pTBy">从文本抽取 document_terms</button>
  <button id="refreshTerms" data-page-node-id="HXcv6GCEYt6Bhug3sZUD91">刷新</button>
</div>
<div class="row" data-page-node-id="3KNH4mcmL3aS6XyJomfHe9">
  <input type="text" id="pairSource" placeholder="原文…" style="width: 150px" data-page-node-id="NGR1q51TjruhKC8iRwBcKG">
  <span style="color: var(--muted)" data-page-node-id="ffwXhKYZD9ZDEma6PNkn6R">→</span>
  <input type="text" id="pairTarget" placeholder="译文…" style="width: 150px" data-page-node-id="PoZTX51UBjhxt2uSbAkMei">
  <button id="addHard" data-page-node-id="4cQTPixsBDnyae6DQroVGU">+ 强制术语 (hard)</button>
  <button id="addSoft" data-page-node-id="cXMCCxZD2OkEqzW0TbF6K0">+ 建议术语 (soft)</button>
</div>
<div class="hint" data-page-node-id="415RCHx6M5BjejltdTf68C">

  <span class="term doc" style="opacity:0.7" data-page-node-id="y2VxZW4q0V8rFUfYQk9fn4">doc</span>

  <span class="term soft" style="opacity:0.7" data-page-node-id="Iu0dURFPchLQjrIOg13v28">soft</span>

<h2 data-page-node-id="dTOgdQVM6jPWm2z0c1bgyr">输入</h2>
<div class="tabs" data-page-node-id="KP95l6zN5gk8zOMD3VbfKk">
  <div class="tab active" data-tab="text" data-page-node-id="qi38PMk1M05OAwuSUZ3l9Z">文本</div>
  <div class="tab" data-tab="url" data-page-node-id="fBAMG5xH0qy5oXXkJyrh6v">URL</div>
</div>
<div class="panel active" data-panel="text" data-page-node-id="xLPFc2BUcadi50LzNgnsEW">
  <textarea id="inputText" placeholder="粘贴要翻译的文本…"></textarea>
</div>
<div class="panel" data-panel="url" data-page-node-id="sgWfFjUM1xBPxJpkLb5gPH">
  <input type="text" id="inputUrl" placeholder="https://example.com/article" style="width: 100%; margin-bottom: 8px" data-page-node-id="pdbJahKR94ITP5pIpthlNw">
  <div class="row" data-page-node-id="gukDoMMFyOqYjnDyA4hQW1">
    <label data-page-node-id="GOBgcMJQuJTO6ASYT6jr7v">模式: <select id="urlMode" data-page-node-id="ZKn2yX9GKoBjN26usHkGUr">
      <option value="bilingual" data-page-node-id="KoQnyShbK8B2JPzmWO8OE7">bilingual</option>
      <option value="replace" data-page-node-id="Kf7DayAoCT2jlPOvrGA2Cv">replace</option>
    </select></label>
  </div>
  <div class="hint" data-page-node-id="ta2zagGyQjm16RY7ItEQLG">返回的 html 字段为完整 HTML，可单独查看 blocks 数组。</div>
</div>

<div class="row" style="margin-top: 12px" data-page-node-id="o2ctZUG9BmPCkETzYG8avB">
  <button class="primary" id="translate" data-page-node-id="k7c2Efltz686uLYcOE0UIU">翻译</button>
  <span class="meta" id="meta" data-page-node-id="5tvXZDyYrwuQoFUduNPYIu"></span>
</div>

<h2 data-page-node-id="CoN8Wq92if5zV3UuFjoYW2">输出</h2>
<div class="output" id="output" data-page-node-id="DqIrQTcAqF5dAY0CRtYi1B">(无输出)</div>
<div class="meta" id="outMeta" data-page-node-id="TgwrCOvXwWD47PCIkdQTQb"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const auth = $('auth');
  const source = $('source');
  const target = $('target');
  const inputText = $('inputText');
  const inputUrl = $('inputUrl');
  const urlMode = $('urlMode');
  const termsEl = $('terms');
  const newTerm = $('newTerm');
  const output = $('output');
  const meta = $('meta');
  const outMeta = $('outMeta');

  // 最近一次拉到的术语表（GET /api/glossary 的完整对象）。
  // 翻译请求必须按**对象**形态传 glossary（{document_terms, hard_terms, soft_terms}）：
  // 早期实现是从 DOM 里刮 .term 的文本拼成 string[]，而后端只认对象 →
  // 扁平数组没有 document_terms 字段，术语被静默丢弃，整条"管理术语→翻译"链路其实没生效。
  let currentGlossary = null;

  // 持久化 token
  auth.value = localStorage.getItem('vocal-saga-auth') || '';
  auth.addEventListener('change', () => localStorage.setItem('vocal-saga-auth', auth.value));

  // tabs
  document.querySelectorAll('.tab').forEach((t) => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x === t));
      document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('active', p.dataset.panel === t.dataset.tab));
    });
  });

  function authHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${auth.value}` };
  }
  async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { ...authHeaders(), ...(opts.headers || {}) } });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `${r.status} ${r.statusText}`);
    return data;
  }

  // 渲染术语
  function renderTerms(g) {
    termsEl.innerHTML = '';
    const all = [
      ...g.user_terms.map((t) => ({ t, k: 'user' })),
      ...g.document_terms.map((t) => ({ t, k: 'doc' })),
      ...(g.hard_terms || []).map((p) => ({ t: `${p.source} → ${p.target}`, k: 'hard', src: p.source, tgt: p.target })),
      ...(g.soft_terms || []).map((p) => ({ t: `${p.source} → ${p.target}`, k: 'soft', src: p.source, tgt: p.target })),
    ];
    for (const { t, k, src, tgt } of all) {
      const el = document.createElement('span');
      el.className = `term ${k}`;
      // 术语对（hard/soft）用 data-src/data-tgt 定位；单词术语用 data-t
      const payload = src === undefined
        ? `data-t="${encodeURIComponent(t)}"`
        : `data-src="${encodeURIComponent(src)}" data-tgt="${encodeURIComponent(tgt)}"`;
      el.innerHTML = `${t} <button title="删除" ${payload} data-k="${k}">×</button>`;
      termsEl.appendChild(el);
    }
    termsEl.querySelectorAll('button[data-k]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const k = btn.dataset.k;
        try {
          if (k === 'user') {
            const term = decodeURIComponent(btn.dataset.t);
            await api(`/api/glossary/${encodeURIComponent(term)}`, { method: 'DELETE' });
          } else if (k === 'doc') {
            // document term: 从当前集合中过滤
            const term = decodeURIComponent(btn.dataset.t);
            const g = await api('/api/glossary');
            const next = g.document_terms.filter((x) => x !== term);
            await api('/api/glossary/document', { method: 'PUT', body: JSON.stringify({ terms: next }) });
          } else {
            // hard / soft 术语对: 从当前集合中过滤掉这一对
            const src = decodeURIComponent(btn.dataset.src);
            const tgt = decodeURIComponent(btn.dataset.tgt);
            const key = k === 'hard' ? 'hard_terms' : 'soft_terms';
            const g = await api('/api/glossary');
            const next = (g[key] || []).filter((p) => !(p.source === src && p.target === tgt));
            await api(`/api/glossary/${k}-terms`, { method: 'PUT', body: JSON.stringify({ terms: next }) });
          }
          await loadTerms();
        } catch (e) { alert('删除失败: ' + e.message); }
      });
    });
  }

  async function loadTerms() {
    try {
      const g = await api('/api/glossary');
      currentGlossary = g;
      renderTerms(g);
    } catch (e) {
      termsEl.innerHTML = `<span class="err">术语加载失败: ${e.message}</span>`;
    }
  }

  $('addTerm').addEventListener('click', async () => {
    const t = newTerm.value.trim();
    if (!t) return;
    try {
      await api('/api/glossary', { method: 'POST', body: JSON.stringify({ terms: [t] }) });
      newTerm.value = '';
      await loadTerms();
    } catch (e) { alert('添加失败: ' + e.message); }
  });

  $('refreshTerms').addEventListener('click', loadTerms);

  // hard / soft 术语对：先拉当前集合，追加后再整体 PUT（接口是"整体替换"语义）
  async function addPair(kind) {
    const source = $('pairSource').value.trim();
    const target = $('pairTarget').value.trim();
    if (!source || !target) { alert('原文和译文都要填'); return; }
    try {
      const key = kind === 'hard' ? 'hard_terms' : 'soft_terms';
      const g = await api('/api/glossary');
      const next = [...(g[key] || []), { source, target }];
      await api(`/api/glossary/${kind}-terms`, { method: 'PUT', body: JSON.stringify({ terms: next }) });
      $('pairSource').value = '';
      $('pairTarget').value = '';
      await loadTerms();
    } catch (e) { alert('添加失败: ' + e.message); }
  }
  $('addHard').addEventListener('click', () => addPair('hard'));
  $('addSoft').addEventListener('click', () => addPair('soft'));

  $('extractTerms').addEventListener('click', async () => {
    const text = inputText.value.trim();
    if (!text) { alert('先在「文本」标签里粘点内容'); return; }
    try {
      await api('/api/glossary/extract?merge=true', { method: 'POST', body: JSON.stringify({ text }) });
      await loadTerms();
    } catch (e) { alert('抽取失败: ' + e.message); }
  });

  // 翻译
  $('translate').addEventListener('click', async () => {
    meta.textContent = '翻译中…';
    output.textContent = '(处理中…)';
    outMeta.textContent = '';
    const t0 = Date.now();
    const activeTab = document.querySelector('.tab.active').dataset.tab;
    // 按后端要求的对象形态传 glossary（避免后端再去读 blob）。
    // user_terms 与 document_terms 都是"保留原文"的单词表，合并进 document_terms；
    // hard_terms / soft_terms 是 {source,target} 术语对，原样透传。
    const glossary = currentGlossary
      ? {
          document_terms: Array.from(new Set([
            ...(currentGlossary.user_terms || []),
            ...(currentGlossary.document_terms || []),
          ])),
          hard_terms: currentGlossary.hard_terms || [],
          soft_terms: currentGlossary.soft_terms || [],
        }
      : undefined;
    try {
      if (activeTab === 'text') {
        const r = await api('/api/translate/text', {
          method: 'POST',
          body: JSON.stringify({
            text: inputText.value,
            source: source.value,
            target: target.value,
            glossary,
          }),
        });
        const txt = (r.translations || []).map((t) => t.text).join('\n');
        output.textContent = txt || '(空)';
        outMeta.textContent = `chunks=${r.chunks} duration=${r.duration_ms}ms elapsed=${Date.now() - t0}ms`;
      } else {
        const r = await api('/api/translate/url', {
          method: 'POST',
          body: JSON.stringify({
            url: inputUrl.value,
            source: source.value,
            target: target.value,
            mode: urlMode.value,
            glossary,
          }),
        });
        output.textContent = r.html || '(空)';
        outMeta.textContent = `blocks=${r.blocks} chunks=${r.chunks} duration=${r.duration_ms}ms elapsed=${Date.now() - t0}ms`;
      }
      meta.textContent = '完成';
    } catch (e) {
      output.textContent = '';
      outMeta.innerHTML = `<span class="err">${e.message}</span>`;
      meta.textContent = '失败';
    }
  });

  // 初始
  loadTerms();
</script>

</body>
</html>
