name = "vocal-saga"
compatibility_date = "2024-09-23"
pages_build_output_dir = "./public"
compatibility_flags = ["nodejs_compat"]

# KV namespace：对应 lib/storage 的 default storage
# 部署前用 `wrangler kv namespace create VOCAL_SAGA_KV` 建一个，把 id 填到下面
[[kv_namespaces]]
binding = "VOCAL_SAGA_KV"
id = "REPLACE_WITH_REAL_KV_ID"

# 本地开发用 miniflare 持久化（可选）
# [[kv_namespaces]]
# binding = "VOCAL_SAGA_KV"
# preview_id = "REPLACE_WITH_PREVIEW_KV_ID"
