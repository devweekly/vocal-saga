name = "vocal-saga"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── KV namespace（对应 lib/storage 的 default storage）─────────
# 复用先前部署的同名 namespace（创建时的 binding 是 KV999，id 不变）。
# 需要换 namespace 时再 wrangler kv namespace create VOCAL_SAGA_KV，
# 把新 id 替换下方。
[[kv_namespaces]]
binding = "VOCAL_SAGA_KV"
id = "d7aff757c61e443ebd63fa3195491208"

# ── Static assets（Workers Static Assets）─────────────────────
# 部署时把 ./public 上传到 Cloudflare，运行时通过 env.ASSETS.fetch 取。
# 路径匹配的（如 /index.html, /translate.html）由 Cloudflare edge 直接返回，
# 不进入 Worker；只有匹配不到 + Worker 没处理的路径才进 Worker。
# 详见 https://developers.cloudflare.com/workers/static-assets/
[assets]
directory = "./public"
binding = "ASSETS"

# ── 公开环境变量（随代码入仓）────────────────────────────────
# 这些不是秘密，可写进 [vars] 块随仓库分发。
# 真要保密请删掉，改用 `wrangler pages secret put NAME` 设。
# [vars]
# CLOUDFLARE_ACCOUNT_ID = ""

# ── 秘密环境变量（不进仓，必须用 secret 命令注入）──────────
# DEEPSEEK_API_KEY
# CLOUDFLARE_API_TOKEN
# NVIDIA_API_KEY
# OPENROUTER_API_KEY
# AUTH_KEY
# 设：wrangler secret put DEEPSEEK_API_KEY
