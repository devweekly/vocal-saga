name = "vocal-saga"
main = "src/worker.ts"
compatibility_date = "2026-05-26"
compatibility_flags = ["nodejs_compat_v2"]

# ── Observability ────────────────────────────────────────────
# 开启 Workers Logs（默认 console.log 进 Tail 看不到，这里显式打开）：
#   - logs.enabled: 全量 stdout/stderr 走 Workers Logs
#   - logs.invocation_logs: 每次 invocation 记一行汇总（status / duration / region）
#   - traces: 留空对象 = 默认 head-based 采样（10%），需要可显式 sampling_rate
# 部署后在 CF Dashboard → Workers → vocal-saga.dal.workers.dev → Logs / Traces 里看。
# 本地 `wrangler dev` 不受影响（dev mode 总是 tail 到本地终端）。
[observability]
[observability.logs]
enabled = true
invocation_logs = true
[observability.traces]

# ── KV namespace（对应 lib/storage 的 default storage）─────────
# 复用先前部署的同名 namespace（创建时的 binding 是 KV999，id 不变）。
# 需要换 namespace 时再 wrangler kv namespace create VOCAL_SAGA_KV，
# 把新 id 替换下方。
[[kv_namespaces]]
binding = "VOCAL_SAGA_KV"
id = "d7aff757c61e443ebd63fa3195491208"

# ── Static assets（Workers Static Assets）─────────────────────
# 部署时把 ./public 上传到 Cloudflare，运行时通过 env.ASSETS.fetch 取。
# 路径匹配的（如 /index.html, /translate.html）由 Cloudflare edge 直接返回，
# 不进入 Worker；只有匹配不到 + Worker 没处理的路径才进 Worker。
# 详见 https://developers.cloudflare.com/workers/static-assets/
[assets]
directory = "./public"
binding = "ASSETS"

# ── 公开环境变量（随代码入仓）────────────────────────────────
# 这些不是秘密，可写进 [vars] 块随仓库分发。
# 真要保密请删掉，改用 `wrangler pages secret put NAME` 设。
# [vars]
# CLOUDFLARE_ACCOUNT_ID = ""

# ── D1 数据库（翻译结果持久化）─────────────────────────────
# 创建：wrangler d1 create vocal-saga
# 迁移：wrangler d1 execute vocal-saga --file=db/schema.sql
[[d1_databases]]
binding = "DB999"
database_name = "vocal-saga"
database_id = "58a00769-d518-40cd-a7d0-b123030a4dc2"

# ── 秘密环境变量（不进仓，必须用 secret 命令注入）──────────
# DEEPSEEK_API_KEY
# CLOUDFLARE_API_TOKEN
# NVIDIA_API_KEY
# OPENROUTER_API_KEY
# AUTH_KEY
# 设：wrangler secret put DEEPSEEK_API_KEY
