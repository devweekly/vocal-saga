name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout fanyi-extension for cross-project checks
        uses: actions/checkout@v4
        with:
          repository: saga/fanyi-extension
          ref: main
          path: .cross-sync/fanyi-extension
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check shared translation modules
        env:
          FANYI_EXTENSION_PATH: ${{ github.workspace }}/.cross-sync/fanyi-extension
        run: npx tsx scripts/check-sync.ts
      - name: Type check
        run: npm run compile
      - name: Unit tests
        run: npm test
      - name: Install local-agent-service dependencies
        run: npm ci --prefix local-agent-service
      - name: Type check local-agent-service
        run: npm run typecheck --prefix local-agent-service
      - name: Test local-agent-service
        run: npm test --prefix local-agent-service
      - name: Evaluate fiction quality regression fixtures
        run: npm run quality:fiction-baseline --prefix local-agent-service -- --output ${{ runner.temp }}/fiction-quality-baseline-report.json
      - name: Upload fiction quality regression report
        uses: actions/upload-artifact@v4
        with:
          name: fiction-quality-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/fiction-quality-baseline-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Build library
        run: npm run build
